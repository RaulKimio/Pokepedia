<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Banner da Poképédia</title>
  <desc id="d">Banner vermelho e azul com o nome Poképédia e a frase: sua pokédex da 1ª geração.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b71c1c"/>
      <stop offset="0.55" stop-color="#d32f2f"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f5e9"/>
      <stop offset="1" stop-color="#a5d6a7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <!-- esferas decorativas -->
  <g opacity="0.14" fill="none" stroke="#fff" stroke-width="10">
    <circle cx="1450" cy="60" r="150"/>
    <circle cx="1450" cy="60" r="90"/>
    <circle cx="120" cy="380" r="130"/>
    <circle cx="120" cy="380" r="70"/>
  </g>

  <!-- esfera central estilizada -->
  <g transform="translate(260 200)">
    <circle r="130" fill="#fff"/>
    <path d="M-130 0 A130 130 0 0 1 130 0 Z" fill="#ef5350"/>
    <rect x="-130" y="-12" width="260" height="24" fill="#263238"/>
    <circle r="130" fill="none" stroke="#263238" stroke-width="12"/>
    <circle r="40" fill="#fff" stroke="#263238" stroke-width="12"/>
    <circle r="16" fill="#90caf9" stroke="#263238" stroke-width="5"/>
  </g>

  <!-- visor estilo pokédex -->
  <g transform="translate(1250 120)">
    <rect width="260" height="160" rx="18" fill="#263238"/>
    <rect x="16" y="16" width="228" height="128" rx="10" fill="url(#screen)"/>
    <g fill="#2e7d32">
      <rect x="36" y="40" width="120" height="10" rx="5"/>
      <rect x="36" y="64" width="170" height="10" rx="5"/>
      <rect x="36" y="88" width="90" height="10" rx="5"/>
      <rect x="36" y="112" width="140" height="10" rx="5"/>
    </g>
    <circle cx="230" cy="-14" r="8" fill="#ffeb3b" stroke="#263238" stroke-width="3"/>
  </g>

  <!-- textos -->
  <text x="470" y="215" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" font-size="110" font-weight="700" fill="#ffeb3b" stroke="#1e3a8a" stroke-width="8" paint-order="stroke" letter-spacing="2">Poképédia</text>
  <text x="474" y="275" font-family="'Trebuchet MS', Verdana, Arial, sans-serif" font-size="38" fill="#ffffff">Sua pokédex da 1ª geração · 151 Pokémon de Kanto</text>
</svg>
