<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="450" height="110" role="img" aria-labelledby="logo-title logo-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logo-title">Poképédia</title>
  <desc id="logo-desc">Logo da Poképédia: uma esfera vermelha e branca com uma lupa, ao lado do nome do site.</desc>

  <!-- Esfera: metade superior vermelha, inferior branca -->
  <path d="M12 50 A40 40 0 0 1 92 50 Z" fill="#d32f2f"/>
  <path d="M12 50 A40 40 0 0 0 92 50 Z" fill="#ffffff"/>
  <circle cx="52" cy="50" r="40" fill="none" stroke="#212121" stroke-width="6"/>
  <line x1="12" y1="50" x2="92" y2="50" stroke="#212121" stroke-width="6"/>

  <!-- Botão central (também funciona como lente da lupa) -->
  <circle cx="52" cy="50" r="13" fill="#ffffff" stroke="#212121" stroke-width="6"/>
  <circle cx="52" cy="50" r="5" fill="#e0e0e0" stroke="#212121" stroke-width="2"/>

  <!-- Cabo da lupa -->
  <line x1="81" y1="79" x2="101" y2="99" stroke="#212121" stroke-width="10" stroke-linecap="round"/>

  <!-- Nome do site (largura fixa para não variar conforme a fonte do sistema) -->
  <text x="114" y="72" font-family="Verdana, Geneva, sans-serif" font-size="62" font-weight="700" textLength="328" lengthAdjust="spacingAndGlyphs" fill="#212121">Poké<tspan fill="#b71c1c">pédia</tspan></text>
</svg>
